name: checks

# Deterministic gates on a clean runner.
#
# The suite gate is `--check` against `docs/agents/known-failures.txt`, which is
# a UNION across hosts: this runner reproduces only 2 of the 44 failures the
# macOS host sees, and both are in the accepted set. A host that reproduces
# fewer failures passes; only a failure outside the union fails (see
# docs/agents/known-failures.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The whitespace gate diffs against the push/PR base, which must exist.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: whitespace
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git diff --check "$BASE..HEAD"
          else
            # First push of a branch: its base object does not exist here, so
            # prove the tip commit and leave the rest to the local hook.
            git show --check --format= HEAD
          fi

  suite:
    # Merge gate: no failure outside the accepted union. Measured at 2m4s for
    # the full suite on this runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: install
        run: bun install --frozen-lockfile
      - name: known-failure set
        run: bun scripts/known-failures.ts --check
